version: 1

indices:
  default:
    include:
      - '/**'
    exclude:
      - '/drafts/**'
      - '/tools/**'
    target: /query-index.json
    properties:
      # Short nav title (e.g. "Arctic Surfing"), matching the source listing
      # cards. Read og:title: on the published pages the index builds from,
      # that carries the short title (the capital meta[name="Title"] the DA
      # authoring render exposed is not present on the live/published HTML).
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      # Clean authored teaser, matching the source cards. Read the standard
      # description meta present on the published pages (the capital
      # meta[name="Description"] is not emitted on the live render).
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')
      # Comma-separated activity categories authored per page (e.g.
      # "Cycling, Travel"), used to build the Adventures listing filter tabs.
      # A page may belong to several categories or none.
      category:
        select: head > meta[name="category"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')
